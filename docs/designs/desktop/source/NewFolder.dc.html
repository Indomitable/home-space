<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New folder dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="hs win {{cls}}">
  <nav class="side" aria-hidden="true">
    <div class="logo"><span class="tile"><span class="ic fill sm">home</span></span><span class="brand">Home Space</span></div>
    <span class="nav on"><span class="ic fill">folder</span>Files</span>
    <span class="nav"><span class="ic">sync</span>Sync queue</span>
    <span class="nav"><span class="ic">delete</span>Recycle bin</span>
    <span class="nav"><span class="ic">devices</span>Devices</span>
  </nav>
  <div class="main" aria-hidden="true">
    <div class="top"><div class="crumbs"><span class="cur">Home</span></div></div>
    <div class="box">
      <div class="thead"><span class="cb"></span><span class="overline">Name ↑</span><span class="overline r">Size</span><span class="overline r">Modified</span><span></span></div>
      <div class="tr"><span class="cb"></span><div class="name"><span class="fi"><span class="ic fill folder">folder</span></span><span class="nm"><span>3d models</span></span></div><span></span><span class="r">3 Nov 2026, 01:05</span><span></span></div>
      <div class="tr"><span class="cb"></span><div class="name"><span class="fi"><span class="ic fill folder">folder</span></span><span class="nm"><span>Books</span></span></div><span></span><span class="r">3 Nov 2026, 01:05</span><span></span></div>
      <div class="tr"><span class="cb"></span><div class="name"><span class="fi"><span class="ic fill folder">folder</span></span><span class="nm"><span>Documents</span></span></div><span></span><span class="r">3 Nov 2026, 01:05</span><span></span></div>
      <div class="tr"><span class="cb"></span><div class="name"><span class="fi"><span class="ic fill folder">folder</span></span><span class="nm"><span>Images</span></span></div><span></span><span class="r">3 Nov 2026, 01:05</span><span></span></div>
    </div>
  </div>

  <div class="backdrop"></div>
  <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="nf">
    <h2 id="nf" class="heading" style="margin: 0">New folder</h2>
    <div class="field">
      <label for="nfn">Name</label>
      <div class="input focus"><input id="nfn" value="Holiday 2026"></div>
      <span class="small muted">In Home</span>
    </div>
    <div class="acts">
      <button class="btn" type="button">Cancel</button>
      <button class="btn primary" type="submit">Create</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return { cls: this.props.dark ? 'dark' : '' }; }
}
</script>
</body>
</html>
