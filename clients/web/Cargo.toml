[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api-client.workspace = true
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8.17"
protocol.workspace = true
serde_json.workspace = true
time = "0.3.55"
tokio.workspace = true
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

[dependencies.web-sys]
version = "0.3.106"
features = [
    "Blob",
    "CloseEvent",
    "DataTransfer",
    "DragEvent",
    "File",
    "FileList",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "ProgressEvent",
    "Storage",
    "WebSocket",
    "Window",
    "XmlHttpRequest",
    "XmlHttpRequestUpload",
]

[dev-dependencies]
uuid = "1.29.0"
time = { version = "0.3.55", features = ["macros"] }
