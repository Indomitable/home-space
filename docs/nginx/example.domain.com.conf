# nginx site for Home Space at https://example.domain.com
#
#   sudo cp docs/nginx/example.domain.com.conf /etc/nginx/conf.d/example.domain.com.conf
#   # edit server_name, certificate paths and the upstream port, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app listens only on loopback: set HOMESPACE_PORT in .env (compose publishes 127.0.0.1:<port>)
# and use the same port in the upstream below.
# Server env: HOMESPACE_PUBLIC_URL=https://example.domain.com
# If nginx.conf already defines a "map $http_upgrade $connection_upgrade", delete the one below.

upstream homespace {
    server 127.0.0.1:8080;   # HOMESPACE_PORT
    keepalive 16;
}

# WebSocket support for /api/v1/ws
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  example.domain.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    client_max_body_size 1m;

    location / {
        proxy_pass http://homespace;
    }

    # Uploads: large bodies, streamed straight to the app.
    location /api/v1/files {
        proxy_pass http://homespace;
        client_max_body_size    10g;   # match HOMESPACE_MAX_UPLOAD_BYTES
        proxy_request_buffering off;
        client_body_timeout     300s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;
    }

    # Downloads: don't spool big files to nginx's temp dir.
    location ~ ^/api/v1/files/.+/content$ {
        proxy_pass http://homespace;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Long-lived WebSocket
    location /api/v1/ws {
        proxy_pass http://homespace;
        proxy_read_timeout 3600s;
    }
}
