[workspace]
resolver = "3"
members = ["api-client", "desktop", "web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
api-client = { path = "api-client" }
protocol = { path = "../shared/protocol" }

reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
