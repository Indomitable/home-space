<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Actions for rent-contract.pdf</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
.act{min-height:56px;display:flex;align-items:center;gap:16px;padding:0 24px;font-size:16px;letter-spacing:.5px;width:100%;text-align:left}
.act .ms{color:var(--on-surface-variant)}
</style>
</helmet>
<div class="m3 phone {{cls}}">
  <header class="topbar">
    <span class="icon-btn on"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span class="title">Documents</span>
    <span class="icon-btn on"><span class="ms" aria-hidden="true">search</span></span>
    <span class="icon-btn"><span class="avatar">V</span></span>
  </header>
  <div class="list" style="flex-grow: 1">
    <div class="li"><div class="lead folder"><span class="ms fill" aria-hidden="true">folder</span></div><div class="txt"><span class="h">Invoices</span></div></div>
    <div class="li"><div class="lead folder"><span class="ms fill" aria-hidden="true">folder</span></div><div class="txt"><span class="h">Taxes 2025</span></div></div>
    <div class="li"><div class="lead"><span class="ms" aria-hidden="true">description</span></div><div class="txt"><span class="h">rent-contract.pdf</span><span class="s tnum">412.3 KB · 28 Oct 2026, 09:14</span></div></div>
  </div>

  <div class="scrim"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Actions for rent-contract.pdf">
    <div class="handle"><span></span></div>
    <div style="display: flex; align-items: center; gap: 16px; padding: 0 24px 16px">
      <div class="lead" style="width: 48px; height: 48px; border-radius: 12px; background: var(--surface-container-highest); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">description</span></div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
        <span class="title-m">rent-contract.pdf</span>
        <span class="body-m muted tnum" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">412.3 KB · 28 Oct 2026, 09:14</span>
      </div>
      <span class="status ok"><span class="ms sm fill" aria-hidden="true">check_circle</span>Offline</span>
    </div>
    <div class="divider"></div>
    <div style="display: flex; flex-direction: column; padding: 8px 0">
      <button class="act" type="button"><span class="ms" aria-hidden="true">edit_document</span>Edit in another app</button>
      <button class="act" type="button"><span class="ms" aria-hidden="true">save_alt</span>Save to…</button>
      <button class="act" type="button"><span class="ms" aria-hidden="true">file_download_off</span>Remove offline copy</button>
      <button class="act" type="button"><span class="ms" aria-hidden="true">info</span>Details</button>
      <button class="act" type="button"><span class="ms" aria-hidden="true">edit</span>Rename</button>
      <button class="act" type="button"><span class="ms" aria-hidden="true">drive_file_move</span>Move</button>
      <div class="divider" style="margin: 8px 0"></div>
      <button class="act" type="button" style="color: var(--error)"><span class="ms" style="color: var(--error)" aria-hidden="true">delete</span>Move to bin</button>
    </div>
    <div class="gesture"><span></span></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"colour":{"editor":"enum","options":["Brand","Dynamic"],"default":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = [];
    if (this.props.dark) c.push('dark');
    if ((this.props.colour ?? 'Brand') === 'Dynamic') c.push('dyn');
    return { cls: c.join(' ') };
  }
}
</script>
</body>
</html>
