[build]
target = "index.html"
dist = "dist"

[tools]
# Sass only bundles the plain CSS files under styles/ (see styles/main.scss).
sass = "1.104.1"

[serve]
address = "127.0.0.1"
port = 8081

[[proxy]]
backend = "ws://127.0.0.1:8080/api/v1/ws"
ws = true

[[proxy]]
backend = "http://127.0.0.1:8080/api/"
