[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
db = { path = "crates/db" }
auth = { path = "crates/auth" }
files = { path = "crates/files" }
notifications = { path = "crates/notifications" }
api = { path = "crates/api" }
protocol = { path = "../shared/protocol", features = ["server"] }

anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
mime_guess = "2.0.5"
rpassword = "7.5.4"
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
