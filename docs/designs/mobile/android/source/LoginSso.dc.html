<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waiting for single sign-on</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="m3 phone {{cls}}">
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 72px 24px 24px; gap: 32px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
      <div style="width: 72px; height: 72px; border-radius: 24px; background: var(--primary-container); color: var(--on-primary-container); display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 40px" aria-hidden="true">home</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 class="headline-m" style="margin: 0">Home Space</h1>
        <p class="body-l muted" style="margin: 0">Sign in to your files</p>
      </div>
    </div>

    <div class="card-filled" style="padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
      <div class="spinner" role="progressbar" aria-label="Signing in"></div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 class="title-l" style="margin: 0">Signing in with Keycloak…</h2>
        <p class="body-m muted" style="margin: 0">Finish in the browser. If you closed it, cancel and try again.</p>
      </div>
      <div style="display: flex; gap: 8px">
        <button class="btn text" type="button">Cancel</button>
        <button class="btn tonal icon-lead" type="button"><span class="ms sm" aria-hidden="true">open_in_new</span>Open browser</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
      <span class="ms muted" aria-hidden="true">dns</span>
      <span class="body-m muted" style="flex-grow: 1">files.mladenov.home</span>
    </div>
  </div>
  <div class="gesture"><span></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"colour":{"editor":"enum","options":["Brand","Dynamic"],"default":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = [];
    if (this.props.dark) c.push('dark');
    if ((this.props.colour ?? 'Brand') === 'Dynamic') c.push('dyn');
    return { cls: c.join(' ') };
  }
}
</script>
</body>
</html>
