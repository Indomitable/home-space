[package]
name = "mobile-core"
description = "The Rust api-client and client-core exported to Kotlin and Swift through UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the .so Android loads through JNA. staticlib: linked into the iOS app.
# lib: for `cargo test` and the bindgen binary.
crate-type = ["lib", "cdylib", "staticlib"]
name = "homespace_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
api-client.workspace = true
client-core.workspace = true
protocol.workspace = true
thiserror.workspace = true
time.workspace = true
uniffi = { version = "0.32.2", features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
wiremock = "0.6.5"
