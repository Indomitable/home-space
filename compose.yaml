# Start the app:   HOMESPACE_JWT_SECRET=<32+ chars> podman compose up --build
# Add a user:      podman compose run --rm app user add <name>
# Run all tests:   podman compose run --rm test
# Try single sign-on with a local Keycloak: podman compose --profile oidc up -d keycloak
#                  (see "Single sign-on" in the README)
services:
  db:
    image: docker.io/library/postgres:latest
    environment:
      POSTGRES_USER: homespace
      POSTGRES_PASSWORD: homespace
      POSTGRES_DB: homespace
    ports:
      - "127.0.0.1:${HOMESPACE_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homespace -d homespace"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://homespace:homespace@db:5432/homespace
      HOMESPACE_JWT_SECRET: ${HOMESPACE_JWT_SECRET:-}
      HOMESPACE_JWT_SECRET_PREVIOUS: ${HOMESPACE_JWT_SECRET_PREVIOUS:-}
      HOMESPACE_PUBLIC_URL: ${HOMESPACE_PUBLIC_URL:-}
      HOMESPACE_OIDC_ISSUER: ${HOMESPACE_OIDC_ISSUER:-}
      HOMESPACE_OIDC_CLIENT_ID: ${HOMESPACE_OIDC_CLIENT_ID:-}
      HOMESPACE_OIDC_CLIENT_SECRET: ${HOMESPACE_OIDC_CLIENT_SECRET:-}
      HOMESPACE_OIDC_NAME: ${HOMESPACE_OIDC_NAME:-Single sign-on}
      HOMESPACE_OIDC_REQUIRED_GROUP: ${HOMESPACE_OIDC_REQUIRED_GROUP:-}
      HOMESPACE_PASSWORD_LOGIN: ${HOMESPACE_PASSWORD_LOGIN:-true}
      RUST_LOG: info
    ports:
      - "127.0.0.1:${HOMESPACE_PORT:-8080}:8080"
    volumes:
      - files:/data
    restart: unless-stopped

  # Optional Keycloak with a ready-made realm (user demo / demo) for trying single sign-on.
  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./docs/keycloak/homespace-realm.json:/opt/keycloak/data/import/homespace-realm.json:ro,z

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://homespace:homespace@db:5432/homespace
    working_dir: /workspace
    volumes:
      - .:/workspace:z
      - server-target:/workspace/server/target
      - clients-target:/workspace/clients/target
      - cargo-registry:/usr/local/cargo/registry

volumes:
  pgdata:
  files:
  server-target:
  clients-target:
  cargo-registry:
