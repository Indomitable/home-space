<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move to recycle bin dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="m3 phone {{cls}}">
  <header class="topbar scrolled">
    <span class="icon-btn on"><span class="ms" aria-hidden="true">close</span></span>
    <span class="title">3 selected</span>
  </header>
  <div class="list" style="flex-grow: 1; padding-top: 8px">
    <div class="li sel"><span class="cb-hit"><span class="cb on"><span class="ms">check</span></span></span><div class="lead folder"><span class="ms fill" aria-hidden="true">folder</span></div><div class="txt"><span class="h">Taxes 2025</span></div></div>
    <div class="li sel"><span class="cb-hit"><span class="cb on"><span class="ms">check</span></span></span><div class="lead"><span class="ms" aria-hidden="true">description</span></div><div class="txt"><span class="h">rent-contract.pdf</span><span class="s tnum">412.3 KB · 28 Oct 2026, 09:14</span></div></div>
    <div class="li sel"><span class="cb-hit"><span class="cb on"><span class="ms">check</span></span></span><div class="lead"><span class="ms" aria-hidden="true">image</span></div><div class="txt"><span class="h">passport-scan.jpg</span><span class="s tnum">3.8 MB · 2 Nov 2026, 11:05</span></div></div>
  </div>
  <div class="scrim"></div>
  <section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dl-title" aria-describedby="dl-body" style="top: 250px; align-items: center; text-align: center">
    <span class="ms" style="color: var(--secondary)" aria-hidden="true">delete</span>
    <h2 id="dl-title" class="hd" style="margin: 0">Move 3 items to recycle bin?</h2>
    <p id="dl-body" class="bd" style="margin: 0; text-align: left">Files inside folders are moved too. You can restore them from the recycle bin.</p>
    <div class="act" style="align-self: stretch">
      <button class="btn text" type="button">Cancel</button>
      <button class="btn text danger-text" type="button">Move to bin</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"colour":{"editor":"enum","options":["Brand","Dynamic"],"default":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = [];
    if (this.props.dark) c.push('dark');
    if ((this.props.colour ?? 'Brand') === 'Dynamic') c.push('dyn');
    return { cls: c.join(' ') };
  }
}
</script>
</body>
</html>
