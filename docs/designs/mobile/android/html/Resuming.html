<!doctype html>

<head>

<div class="m3 phone">

    <div style="width: 96px; height: 96px; border-radius: 48px; background: var(--error-container); color: var(--on-error-container); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 48px" aria-hidden="true">cloud_off</span></div>

      <h1 class="headline-s" style="margin: 0">Could not resume your session</h1>
      <p class="body-m muted" style="margin: 0">The server at files.mladenov.home didn't answer. Check that you're on your home network or VPN.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; width: 100%">
      <button class="btn filled wide icon-lead" type="button"><span class="ms sm" aria-hidden="true">refresh</span>Retry</button>
      <button class="btn text wide" type="button">Sign out</button>
    </div>
  </div>
  <div class="gesture"><span></span></div>
