[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api-client.workspace = true
client-core.workspace = true
base64 = "0.23.1"
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8.17"
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
time = "0.3.55"
tokio.workspace = true
uuid = "1.29.0"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"

[dependencies.web-sys]
version = "0.3.107"
features = [
    "Blob",
    "CloseEvent",
    "Crypto",
    "CssStyleDeclaration",
    "DataTransfer",
    "DomRect",
    "DragEvent",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "ProgressEvent",
    "Storage",
    "WebSocket",
    "Window",
    "XmlHttpRequest",
    "XmlHttpRequestUpload",
]

[dev-dependencies]
time = { version = "0.3.55", features = ["macros"] }
