<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move 2 items</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="m3 phone {{cls}}" role="dialog" aria-modal="true" aria-labelledby="mv-title">
  <header class="topbar">
    <button class="icon-btn on" type="button" aria-label="Cancel"><span class="ms" aria-hidden="true">close</span></button>
    <div style="flex-grow: 1; min-width: 0; padding: 0 12px; display: flex; flex-direction: column">
      <h1 id="mv-title" class="title-l" style="margin: 0">Move 2 items</h1>
    </div>
  </header>

  <div style="padding: 0 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div class="card-filled" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px">
      <span class="ms muted" aria-hidden="true">drive_file_move</span>
      <span class="body-m" style="flex-grow: 1">rent-contract.pdf, passport-scan.jpg</span>
    </div>
    <nav class="crumbs" aria-label="Destination" style="padding: 0">
      <a href="#">Home</a><span class="ms sep" aria-hidden="true">chevron_right</span><a href="#">Documents</a><span class="ms sep" aria-hidden="true">chevron_right</span><span class="cur label-l" aria-current="page">Invoices</span>
    </nav>
  </div>
  <div class="divider"></div>

  <div class="list" style="flex-grow: 1; overflow: hidden; padding-top: 8px">
    <button class="li one pad" type="button" style="width: 100%; text-align: left"><div class="lead plain"><span class="ms muted" aria-hidden="true">arrow_upward</span></div><div class="txt"><span class="h">Up to Documents</span></div></button>
    <button class="li one pad" type="button" style="width: 100%; text-align: left"><div class="lead folder"><span class="ms fill" aria-hidden="true">folder</span></div><div class="txt"><span class="h">2025</span></div><span class="ms muted" aria-hidden="true">chevron_right</span></button>
    <button class="li one pad" type="button" style="width: 100%; text-align: left"><div class="lead folder"><span class="ms fill" aria-hidden="true">folder</span></div><div class="txt"><span class="h">2026</span></div><span class="ms muted" aria-hidden="true">chevron_right</span></button>
    <button class="li one pad" type="button" style="width: 100%; text-align: left"><div class="lead folder"><span class="ms fill" aria-hidden="true">folder</span></div><div class="txt"><span class="h">Utilities</span></div><span class="ms muted" aria-hidden="true">chevron_right</span></button>
  </div>

  <div style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--surface-container)">
    <button class="btn text icon-lead" type="button" style="padding-left: 12px"><span class="ms sm" aria-hidden="true">create_new_folder</span>New folder</button>
    <button class="btn filled" type="button">Move to Invoices</button>
  </div>
  <div class="gesture" style="background: var(--surface-container)"><span></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"colour":{"editor":"enum","options":["Brand","Dynamic"],"default":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = [];
    if (this.props.dark) c.push('dark');
    if ((this.props.colour ?? 'Brand') === 'Dynamic') c.push('dyn');
    return { cls: c.join(' ') };
  }
}
</script>
</body>
</html>
