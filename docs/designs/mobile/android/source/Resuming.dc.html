<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Could not resume session</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="m3 phone {{cls}}">
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 32px; gap: 24px; text-align: center">
    <div style="width: 96px; height: 96px; border-radius: 48px; background: var(--error-container); color: var(--on-error-container); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 48px" aria-hidden="true">cloud_off</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 class="headline-s" style="margin: 0">Could not resume your session</h1>
      <p class="body-m muted" style="margin: 0">The server at files.mladenov.home didn't answer. Check that you're on your home network or VPN.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; width: 100%">
      <button class="btn filled wide icon-lead" type="button"><span class="ms sm" aria-hidden="true">refresh</span>Retry</button>
      <button class="btn text wide" type="button">Sign out</button>
    </div>
  </div>
  <div class="gesture"><span></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"colour":{"editor":"enum","options":["Brand","Dynamic"],"default":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = [];
    if (this.props.dark) c.push('dark');
    if ((this.props.colour ?? 'Brand') === 'Dynamic') c.push('dyn');
    return { cls: c.join(' ') };
  }
}
</script>
</body>
</html>
