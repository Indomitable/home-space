<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0} .li .lead.plain{color:var(--on-surface-variant)}</style>
</helmet>
<div class="m3 phone {{cls}}">
  <header class="topbar">
    <a href="Settings.dc.html" class="icon-btn on" aria-label="Back"><span class="ms" aria-hidden="true">arrow_back</span></a>
    <h1 class="title" style="margin: 0; font-weight: 400">Profile</h1>
  </header>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 24px 24px; text-align: center">
      <span class="avatar lg">V</span>
      <h2 class="headline-s" style="margin: 8px 0 0">ventsi</h2>
      <span class="body-m muted">Signed in with Keycloak</span>
      <span class="chip lead" style="margin-top: 8px"><span class="ms sm" aria-hidden="true">dns</span>files.mladenov.home</span>
    </div>
    <div class="divider"></div>

    <h3 class="section" style="margin: 0">Devices</h3>
    <div class="li pad"><div class="lead plain"><span class="ms" aria-hidden="true">smartphone</span></div><div class="txt"><span class="h">Pixel 9</span><span class="s">This phone · Android</span></div><span class="status info">Current</span></div>
    <div class="li"><div class="lead plain"><span class="ms" aria-hidden="true">laptop</span></div><div class="txt"><span class="h">Laptop</span><span class="s tnum">Linux · seen 7 Nov 2026, 07:55</span></div><button class="icon-btn" type="button" aria-label="Actions for Laptop"><span class="ms" aria-hidden="true">more_vert</span></button></div>
    <div class="li"><div class="lead plain"><span class="ms" aria-hidden="true">language</span></div><div class="txt"><span class="h">Firefox on desktop</span><span class="s tnum">Web · seen 3 Nov 2026, 22:10</span></div><button class="icon-btn" type="button" aria-label="Actions for Firefox on desktop"><span class="ms" aria-hidden="true">more_vert</span></button></div>
    <div class="li"><div class="lead plain"><span class="ms" aria-hidden="true">tablet</span></div><div class="txt"><span class="h">iPad</span><span class="s">iOS · signed out</span></div><button class="icon-btn" type="button" aria-label="Actions for iPad"><span class="ms" aria-hidden="true">more_vert</span></button></div>

    <div style="flex-grow: 1"></div>
    <div style="padding: 16px 24px 24px">
      <button class="btn outlined wide icon-lead" type="button" style="color: var(--error); border-color: var(--outline-variant)"><span class="ms sm" aria-hidden="true">logout</span>Sign out</button>
    </div>
  </div>
  <div class="gesture"><span></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"colour":{"editor":"enum","options":["Brand","Dynamic"],"default":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = [];
    if (this.props.dark) c.push('dark');
    if ((this.props.colour ?? 'Brand') === 'Dynamic') c.push('dyn');
    return { cls: c.join(' ') };
  }
}
</script>
</body>
</html>
