<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rename dialog</title>
<link rel="stylesheet" href="m3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</head>
<body>
<div class="m3 phone">
  <header class="topbar">
    <span class="icon-btn on"><span class="ms" aria-hidden="true">arrow_back</span></span>
    <span class="title">Documents</span>
    <span class="icon-btn on"><span class="ms" aria-hidden="true">search</span></span>
    <span class="icon-btn"><span class="avatar">V</span></span>
  </header>
  <div class="list" style="flex-grow: 1">
    <div class="li"><div class="lead folder"><span class="ms fill" aria-hidden="true">folder</span></div><div class="txt"><span class="h">Invoices</span></div></div>
    <div class="li"><div class="lead folder"><span class="ms fill" aria-hidden="true">folder</span></div><div class="txt"><span class="h">Taxes 2025</span></div></div>
    <div class="li"><div class="lead"><span class="ms" aria-hidden="true">description</span></div><div class="txt"><span class="h">rent-contract.pdf</span><span class="s tnum">412.3 KB · 28 Oct 2026, 09:14</span></div></div>
  </div>
  <div class="scrim"></div>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="rn-title" style="top: 200px; --bg: var(--surface-container-high)">
    <h2 id="rn-title" class="hd" style="margin: 0">Rename “rent-contract.pdf”</h2>
    <div class="tf" style="margin-top: 8px">
      <label class="lbl focus" for="rn">Name</label>
      <div class="box focus"><input id="rn" class="val" value="rent-contract-2026.pdf" style="border: 0; background: none; font: inherit; color: inherit; outline: none"><button class="icon-btn" type="button" aria-label="Clear name"><span class="ms" aria-hidden="true">cancel</span></button></div>
      <div class="sup">Opens with the name selected, not the extension.</div>
    </div>
    <div class="act">
      <button class="btn text" type="button">Cancel</button>
      <button class="btn text" type="button">Rename</button>
    </div>
  </section>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: var(--surface-container-highest); display: flex; align-items: center; justify-content: center" aria-hidden="true">
    <span class="body-m muted">Keyboard</span>
  </div>
</div>
</body>
</html>
