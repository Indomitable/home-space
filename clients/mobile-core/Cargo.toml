[package]
name = "mobile-core"
description = "The Rust api-client and client-core exported to Kotlin and Swift through UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the .so Android loads through JNA. staticlib: linked into the iOS app.
# lib: for `cargo test` and the bindgen binary.
crate-type = ["lib", "cdylib", "staticlib"]
name = "homespace_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
api-client.workspace = true
client-core.workspace = true
hex = "0.4.3"
protocol.workspace = true
rand = "0.10.3"
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
uniffi = "0.32.2"
url = "2"
uuid = "1.29.0"

# Android's certificate checks run in the JVM, so the verifier needs a handle on it (see `android`).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
wiremock = "0.6.5"
