<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Could not resume the session</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="hs win {{cls}}" style="align-items: center; justify-content: center">
  <section class="panel" role="alert" style="width: 420px; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
    <div style="width: 56px; height: 56px; border-radius: 28px; background: var(--color-danger-soft); color: var(--color-danger); display: flex; align-items: center; justify-content: center"><span class="ic" style="font-size: 30px" aria-hidden="true">cloud_off</span></div>
    <h1 class="heading" style="margin: 0">Could not resume the session</h1>
    <p class="muted" style="margin: 0">files.mladenov.home didn't answer: connection refused. Check that you're on your home network or VPN.</p>
    <div style="display: flex; gap: 8px; margin-top: 8px">
      <button class="btn" type="button">Sign out</button>
      <button class="btn primary" type="button"><span class="ic sm" aria-hidden="true">refresh</span>Retry</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return { cls: this.props.dark ? 'dark' : '' }; }
}
</script>
</body>
</html>
