[package]
name = "sync-core"
description = "Two-way sync of remote folders and files with local ones, shared by the desktop and mobile clients."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api-client.workspace = true
client-core.workspace = true
futures = "0.3"
hex = "0.4.3"
protocol.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
wiremock = "0.6.5"
