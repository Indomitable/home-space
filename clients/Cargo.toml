[workspace]
resolver = "3"
members = ["api-client", "client-core", "desktop", "mobile-core", "web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
api-client = { path = "api-client" }
client-core = { path = "client-core" }
protocol = { path = "../shared/protocol" }

base64 = "0.23.1"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

# The mobile library (mobile-core): smaller rather than faster, since it ships inside the apps.
# Panics stay `unwind`: UniFFI turns a panic into an error for the caller instead of a crash.
[profile.mobile]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
