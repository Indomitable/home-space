<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folders that upload</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="m3 phone {{cls}}">
  <header class="topbar">
    <a href="Settings.dc.html" class="icon-btn on" aria-label="Back"><span class="ms" aria-hidden="true">arrow_back</span></a>
    <h1 class="title" style="margin: 0; font-weight: 400">Folders that upload</h1>
    <button class="icon-btn on" type="button" aria-label="Sync now"><span class="ms" aria-hidden="true">sync</span></button>
  </header>

  <div style="flex-grow: 1; overflow: hidden; padding: 8px 16px; display: flex; flex-direction: column; gap: 12px">
    <div class="card-filled" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; background: var(--secondary-container); color: var(--on-secondary-container)">
      <span class="ms" aria-hidden="true">wifi_off</span>
      <span class="body-m" style="flex-grow: 1">Waiting for Wi-Fi</span>
    </div>

    <article class="card-outlined" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 16px">
        <div class="lead" style="width: 40px; height: 40px; border-radius: 12px; background: var(--tertiary-container); color: var(--on-tertiary-container); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">photo_camera</span></div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
          <h2 class="title-m" style="margin: 0">Camera photos and videos</h2>
          <span class="body-m muted">To Home / Photos / Phone</span>
        </div>
      </div>
      <div class="lin"><i style="width: 40%"></i></div>
      <span class="body-m muted tnum">12 to go</span>
      <div style="display: flex; gap: 8px; justify-content: flex-end">
        <button class="btn text" type="button">Remove</button>
        <button class="btn outlined" type="button">Change folder</button>
      </div>
    </article>

    <article class="card-outlined" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 16px">
        <div class="lead" style="width: 40px; height: 40px; border-radius: 12px; background: var(--tertiary-container); color: var(--on-tertiary-container); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">folder_open</span></div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
          <h2 class="title-m" style="margin: 0">Download</h2>
          <span class="body-m muted">To Home / Phone downloads</span>
        </div>
        <span class="status ok"><span class="ms sm fill" aria-hidden="true">check_circle</span>Done</span>
      </div>
      <span class="body-m muted tnum">Up to date, 7 Nov 2026, 08:10</span>
      <div style="display: flex; gap: 8px; justify-content: flex-end">
        <button class="btn text" type="button">Remove</button>
        <button class="btn outlined" type="button">Change folder</button>
      </div>
    </article>
  </div>

  <button class="fab ext" type="button" style="bottom: 40px"><span class="ms" aria-hidden="true">add</span>Add folder</button>
  <div class="gesture"><span></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"colour":{"editor":"enum","options":["Brand","Dynamic"],"default":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = [];
    if (this.props.dark) c.push('dark');
    if ((this.props.colour ?? 'Brand') === 'Dynamic') c.push('dyn');
    return { cls: c.join(' ') };
  }
}
</script>
</body>
</html>
