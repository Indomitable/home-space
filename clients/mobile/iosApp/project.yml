# XcodeGen spec for the iOS app; generate the project with `xcodegen generate` in this folder.
# The .xcodeproj is not committed, so there is no project.pbxproj to merge.
name: iosApp
options:
  bundleIdPrefix: app.homespace
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
aggregateTargets:
  # Builds clients/mobile-core (the Rust client) into an xcframework and generates its Swift
  # bindings.
  RustCore:
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    buildScripts:
      - name: Compile Rust core
        basedOnDependencyAnalysis: false
        script: |
          profile=mobile
          [ "$CONFIGURATION" = Debug ] && profile=debug
          "$SRCROOT/../../mobile-core/scripts/build-ios.sh" "$profile"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
      # Swift bindings generated by clients/mobile-core/scripts/build-ios.sh.
      - path: ../build/rust-core/ios/swift
        group: RustCore
    dependencies:
      # Built first, so the xcframework is not rewritten while this target reads it.
      - target: RustCore
      # Static libraries, so nothing is embedded.
      - framework: ../build/rust-core/ios/HomeSpaceCore.xcframework
        embed: false
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Home Space
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Plain HTTP only to local addresses, for a dev server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Shown when the app first connects to a server on the LAN (devices only).
        NSLocalNetworkUsageDescription: Home Space connects to your Home Space server on the local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.homespace.ios
        GENERATE_INFOPLIST_FILE: NO
        # Assets.xcassets has no app icon yet, and the default name makes one required.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.homespace.ios.uitests
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    test:
      targets:
        - iosAppUITests
