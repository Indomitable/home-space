# XcodeGen spec for the iOS app; generate the project with `xcodegen generate` in this folder.
# The .xcodeproj is not committed, so there is no project.pbxproj to merge.
name: iosApp
options:
  bundleIdPrefix: app.homespace
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
aggregateTargets:
  # Spike: builds clients/mobile-core into an xcframework and generates its Swift bindings.
  RustCore:
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    buildScripts:
      - name: Compile Rust core
        basedOnDependencyAnalysis: false
        script: |
          profile=mobile
          [ "$CONFIGURATION" = Debug ] && profile=debug
          "$SRCROOT/../../mobile-core/scripts/build-ios.sh" "$profile"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
      # Spike: Swift bindings generated by clients/mobile-core/scripts/build-ios.sh.
      - path: ../build/rust-core/ios/swift
        group: RustCore
    dependencies:
      # Built first, so the xcframework is not rewritten while this target reads it.
      - target: RustCore
      # Static libraries, so nothing is embedded.
      - framework: ../build/rust-core/ios/HomeSpaceCore.xcframework
        embed: false
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Home Space
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Plain HTTP only to local addresses, for a dev server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.homespace.ios
        GENERATE_INFOPLIST_FILE: NO
        # Gradle writes the Kotlin framework here (see the pre-build script).
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
        # The Gradle script writes outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.homespace.ios.uitests
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    test:
      targets:
        - iosAppUITests
