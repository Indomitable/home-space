[package]
name = "protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
server = ["dep:sqlx", "uuid/v7"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "postgres", "uuid"], optional = true }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.154"
