<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="m3 phone {{cls}}">
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 72px 24px 24px; gap: 32px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
      <div style="width: 72px; height: 72px; border-radius: 24px; background: var(--primary-container); color: var(--on-primary-container); display: flex; align-items: center; justify-content: center"><span class="ms fill" style="font-size: 40px" aria-hidden="true">home</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 class="headline-m" style="margin: 0">Home Space</h1>
        <p class="body-l muted" style="margin: 0">Sign in to your files</p>
      </div>
    </div>

    <form style="display: flex; flex-direction: column; gap: 20px">
      <div class="tf">
        <label class="lbl" for="server">Server</label>
        <div class="box"><span class="ms muted" aria-hidden="true">dns</span><input id="server" class="val" value="files.mladenov.home" style="border: 0; background: none; font: inherit; color: inherit; outline: none"><span class="ms ok" style="margin-right: 12px" aria-label="Connected">check_circle</span></div>
        <div class="sup">Connected · password and single sign-on</div>
      </div>

      <button class="btn filled wide icon-lead" type="button"><span class="ms sm" aria-hidden="true">key</span>Sign in with Keycloak</button>

      <div style="display: flex; align-items: center; gap: 16px">
        <div class="divider" style="flex-grow: 1"></div><span class="label-m muted">or</span><div class="divider" style="flex-grow: 1"></div>
      </div>

      <div class="tf">
        <label class="lbl focus" for="user">Username</label>
        <div class="box focus"><span class="ms acc" aria-hidden="true">person</span><input id="user" class="val" value="ventsi" style="border: 0; background: none; font: inherit; color: inherit; outline: none"><span class="caret"></span></div>
      </div>
      <div class="tf">
        <label class="lbl" for="pw">Password</label>
        <div class="box"><span class="ms muted" aria-hidden="true">lock</span><input id="pw" class="val" type="password" value="password" style="border: 0; background: none; font: inherit; color: inherit; outline: none"><button class="icon-btn" type="button" aria-label="Show password"><span class="ms" aria-hidden="true">visibility</span></button></div>
      </div>
      <button class="btn tonal wide" type="submit">Sign in</button>
    </form>
  </div>
  <div class="gesture"><span></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"colour":{"editor":"enum","options":["Brand","Dynamic"],"default":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = [];
    if (this.props.dark) c.push('dark');
    if ((this.props.colour ?? 'Brand') === 'Dynamic') c.push('dyn');
    return { cls: c.join(' ') };
  }
}
</script>
</body>
</html>
