<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<link rel="stylesheet" href="hs.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</head>
<body>
<div class="hs win" style="align-items: center; justify-content: center; background: radial-gradient(600px 400px at 50% 40%, var(--color-accent-soft), transparent), var(--color-bg)">
  <form class="panel" style="width: 400px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: var(--color-accent); color: var(--color-on-accent); display: flex; align-items: center; justify-content: center"><span class="ic fill" style="font-size: 30px" aria-hidden="true">home</span></div>
      <div>
        <h1 class="title" style="margin: 0">Home Space</h1>
        <p class="muted" style="margin: 0">Sign in to your files</p>
      </div>
    </div>

    <div class="field">
      <label for="srv">Server</label>
      <div class="input"><span class="ic muted" aria-hidden="true">dns</span><input id="srv" value="https://files.mladenov.home"><span class="ic fill ok" aria-label="Connected">check_circle</span></div>
      <span class="small muted">Connected · password and single sign-on</span>
    </div>

    <button class="btn primary" type="button" style="justify-content: center; height: 40px"><span class="ic sm" aria-hidden="true">key</span>Sign in with Keycloak</button>

    <div style="display: flex; align-items: center; gap: 12px"><div style="flex-grow: 1; height: 1px; background: var(--color-border)"></div><span class="small muted">or</span><div style="flex-grow: 1; height: 1px; background: var(--color-border)"></div></div>

    <div class="field">
      <label for="usr">Username</label>
      <div class="input focus"><input id="usr" value="v.mladenov"></div>
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <div class="input"><input id="pw" type="password" value="password"><button class="icon-btn" type="button" aria-label="Show password" style="width: 28px; height: 28px"><span class="ic sm" aria-hidden="true">visibility</span></button></div>
    </div>
    <button class="btn" type="submit" style="justify-content: center; height: 40px">Sign in</button>
  </form>
</div>
</body>
</html>
