[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "HomeSpace"
path = "src/main.rs"

[dependencies]
api-client.workspace = true
client-core.workspace = true
hex = "0.4.3"
iced = { version = "0.14.0", features = ["advanced", "svg", "tokio"] }
keyring = { version = "4.2.0", optional = true }
notify = "8.2.1"
open = "5.4.5"
png = "0.18.1"
rand = "0.10.3"
protocol.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rfd = "0.17.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.1"
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.20", features = ["io"] }
trash = "5.2.9"

[features]
# Keep the session in the system keyring (macOS Keychain, Secret Service, ...). Without it the
# session is a file under ~/.local/share/home-space, which unsigned dev builds can read without
# unlocking the keychain after every rebuild.
keyring = ["dep:keyring"]
# Lets the app be inspected: enables iced's devtools (F12 overlay) and reports to the `comet`
# debugger. Use comet's 0.14.0 tag to match iced 0.14:
#   cargo install --git https://github.com/iced-rs/comet --tag 0.14.0 && comet
#   cargo run -p desktop --features debug
debug = ["iced/debug"]

# macOS formats dates through Foundation instead (see src/locale.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
icu_datetime = "2.4.0"
icu_locale = "2.4.0"
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSData", "NSDate", "NSDateFormatter", "NSFormatter", "NSNotification", "NSOperation", "NSString"] }

[package.metadata.bundle]
name = "Home Space"
identifier = "io.github.indomitable.home-space"
icon = ["packaging/home-space.icns"]
category = "public.app-category.productivity"
short_description = "Browse and transfer your home-space files"

[dev-dependencies]
iced_test = "0.14.0"
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
uuid = "1.29.0"
